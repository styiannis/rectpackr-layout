name: Verify

on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (build & test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify (type checks, linting, build, dist checks)
        run: npm run verify

      - name: Test script with coverage reporting
        run: npm run test-coverage
