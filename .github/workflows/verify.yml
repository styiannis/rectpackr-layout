name: Verify

on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify (type checks, linting, build, dist checks)
        run: npm run verify

      - name: Test script with coverage reporting
        run: npm run test-coverage

      - name: Set up Node.js 24 (recent major)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check dist loads (Node 24)
        run: npm run check-dist-loads
